<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calendário eleitoral ilustrativo com consultas por ano e tema.">
  <title>Calendário eleitoral</title>
  <link rel="stylesheet" href="assets/estilos.css">
  <script src="assets/dados.js" defer></script>
  <script src="assets/consultas.js" defer></script>
  <script src="assets/comum.js" defer></script>
  <script src="assets/paginas.js" defer></script>
</head>
<body data-page="calendario">
  <div id="site-header"></div>
  <main id="conteudo" class="container" tabindex="-1">
    <nav class="breadcrumb" aria-label="Você está em"><a href="index.html">Início</a><span aria-hidden="true">›</span><span>Calendário eleitoral</span></nav>
    <header class="page-heading"><p class="eyebrow">Eleições</p><h1>Calendário eleitoral</h1><p>Consulte as datas e os prazos de cada etapa do processo eleitoral.</p></header>
    <p id="route-notice" class="notice" role="status" hidden></p>
    <section id="list-view" aria-label="Consulta de datas eleitorais">
      <form id="filters" class="filter-panel">
        <h2>Consultar calendário</h2>
        <div class="fields two">
          <div class="field"><label for="ano">Ano da eleição</label><select id="ano" name="ano"><option value="">Todos os anos</option><option>2026</option><option>2024</option></select></div>
          <div class="field"><label for="tema">Tema</label><select id="tema" name="tema"><option value="">Todos os temas</option><option>Título eleitoral</option><option>Candidaturas</option><option>Propaganda eleitoral</option><option>Votação</option><option>Prestação de contas</option></select></div>
        </div>
        <div class="form-actions"><button class="button" type="submit">Consultar</button><button class="button button-secondary" type="reset">Limpar filtros</button><p class="form-help">Datas ilustrativas para uso acadêmico.</p></div>
      </form>
      <div class="results-bar"><h2 id="result-count" role="status" aria-live="polite"></h2><p>Em ordem cronológica</p></div>
      <div id="results" class="record-list"></div>
    </section>
    <section id="detail-view" aria-label="Detalhes da data eleitoral" hidden></section>
    <noscript><a href="index.html">Voltar ao início</a>.</p></noscript>
  </main>
  <div id="site-footer"></div>
</body>
</html>
