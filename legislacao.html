<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pesquisa de resoluções e portarias ilustrativas por assunto, tipo e ano.">
  <title>Legislação compilada | TSE</title>
  <link rel="stylesheet" href="assets/estilos.css">
  <script src="assets/dados.js" defer></script>
  <script src="assets/consultas.js" defer></script>
  <script src="assets/comum.js" defer></script>
  <script src="assets/paginas.js" defer></script>
</head>
<body data-page="legislacao">
  <div id="site-header"></div>
  <main id="conteudo" class="container" tabindex="-1">
    <nav class="breadcrumb" aria-label="Você está em"><a href="index.html">Início</a><span aria-hidden="true">›</span><span>Legislação compilada</span></nav>
    <header class="page-heading"><p class="eyebrow">Consulta normativa</p><h1>Legislação compilada</h1><p>Pesquise atos normativos por assunto, tipo e ano de publicação.</p></header>
    <p id="route-notice" class="notice" role="status" hidden></p>
    <section id="list-view" aria-label="Pesquisa de normas">
      <form id="filters" class="filter-panel">
        <h2>Pesquisar normas</h2>
        <div class="fields legislation">
          <div class="field"><label for="busca">Assunto ou número da norma</label><input type="search" name="busca" id="busca" placeholder="Ex.: propaganda eleitoral" maxlength="100"></div>
          <div class="field"><label for="tipo">Tipo de norma</label><select id="tipo" name="tipo"><option value="">Todos os tipos</option><option>Resolução</option><option>Portaria</option></select></div>
          <div class="field"><label for="ano">Ano de publicação</label><select id="ano" name="ano"><option value="">Todos os anos</option><option>2026</option><option>2025</option><option>2024</option></select></div>
        </div>
        <div class="form-actions"><button class="button" type="submit">Pesquisar</button><button class="button button-secondary" type="reset">Limpar filtros</button></div>
      </form>
      <div class="results-bar"><h2 id="result-count" role="status" aria-live="polite"></h2><div class="sort-field"><label for="ordem">Ordenar por</label><select id="ordem"><option value="antigas">Mais antigas primeiro</option><option value="recentes">Mais recentes primeiro</option></select></div></div>
      <div id="results" class="record-list"></div>
    </section>
    <section id="detail-view" aria-label="Texto da norma" hidden></section>
    <noscript><p class="notice">Ative o JavaScript para pesquisar normas. Protótipo acadêmico com dados fictícios. <a href="index.html">Voltar ao início</a>.</p></noscript>
  </main>
  <div id="site-footer"></div>
</body>
</html>
